<!-- "MORE SELECTED WORK" PAGE — several compact cases on one shared physical page.
     Each case is a delimited block (~60 words) so it's easy to reorder or drop one;
     they just can't each be a separate file the way full-page cases are, since three
     of them share one .page. Copy/paste a block to add a case, delete one to remove. -->
<section class="page">
  <div class="frame">
    <div class="label">More Selected Work</div>
    <h2 style="margin-top:2mm">[Optional short section headline, or omit]</h2>

    <!-- ── CASE BLOCK: start ── -->
    <div class="compact">
      <div>
        <img class="shot" style="height:32mm" src="assets/[expected-filename].jpg" alt="[description]">
        <!-- or, if missing:
        <div class="placeholder" style="height:32mm"><div class="tag">MISSING</div><div>[expected-filename].jpg</div></div>
        -->
      </div>
      <div>
        <h3>[CASE HEADER]</h3>
        <p style="margin-top:1.5mm">[~60 words: problem, what was done, outcome. Plain language.]</p>
        <div class="role"><b>Role:</b> [Role title] &mdash; [Client or "confidential client"], [years]</div>
      </div>
    </div>
    <!-- ── CASE BLOCK: end ── -->

    <hr class="rule">

    <!-- repeat the CASE BLOCK above for each additional compact case -->

  </div>
  <div class="foot">
    <span>FOXIO DESIGN. &middot; foxiodesign.com &middot; contact@foxiodesign.com</span>
    <span class="pageno">[N]</span>
  </div>
</section>
